<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="100%" height="100%">
  <defs>
    <!-- Dark obsidian background gradient -->
    <linearGradient id="bgLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="45%" stop-color="#121215" />
      <stop offset="85%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Radial spotlight gradient -->
    <radialGradient id="spotlight" cx="70%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="40%" stop-color="#71717a" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="leftAmbient" cx="20%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="60%" stop-color="#27272a" stop-opacity="0.02" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic silver strokes -->
    <linearGradient id="silverStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="70%" stop-color="#a1a1aa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a1a1aa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="streamWave" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#a1a1aa" stop-opacity="0.5" />
      <stop offset="75%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.035" />
      <circle cx="40" cy="40" r="0.8" fill="#ffffff" fill-opacity="0.15" />
    </pattern>

    <!-- Dot Matrix Pattern -->
    <pattern id="dotMatrix" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06" />
    </pattern>

    <!-- Subtle Glow Filter -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      @keyframes radarSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes reverseSpin {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.3); opacity: 1; }
      }
      @keyframes pulseSlow {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.5; }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -1200; }
      }
      .spin-ring {
        transform-origin: 1200px 240px;
        animation: radarSpin 60s linear infinite;
      }
      .spin-ring-reverse {
        transform-origin: 1200px 240px;
        animation: reverseSpin 45s linear infinite;
      }
      .pulsing-node {
        animation: pulseNode 3s ease-in-out infinite;
        transform-origin: center;
      }
      .ambient-glow {
        animation: pulseSlow 6s ease-in-out infinite;
      }
      .flowing-data {
        stroke-dasharray: 8 16;
        animation: waveFlow 30s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1600" height="500" fill="url(#bgLinear)" />

  <!-- Ambient Light Spills -->
  <rect width="1600" height="500" fill="url(#spotlight)" />
  <rect width="1600" height="500" fill="url(#leftAmbient)" />

  <!-- Geometric Architectural Grid -->
  <rect width="1600" height="500" fill="url(#techGrid)" />
  
  <!-- Subtle Dot Matrix Zone on Right -->
  <rect x="900" y="0" width="700" height="500" fill="url(#dotMatrix)" opacity="0.6" />

  <!-- Top Subtle Highlight Bevel Line -->
  <line x1="0" y1="4" x2="1600" y2="4" stroke="url(#silverStroke)" stroke-width="1.5" />

  <!-- Left Side: Architectural Waves (Cross-Platform & Full-Stack Data Flow) -->
  <g opacity="0.45">
    <path d="M -100 380 C 250 380, 450 180, 800 240 C 1150 300, 1350 120, 1700 180" fill="none" stroke="url(#streamWave)" stroke-width="1.5" />
    <path d="M -100 400 C 280 400, 420 210, 780 270 C 1140 330, 1320 150, 1700 210" fill="none" stroke="url(#streamWave)" stroke-width="1" opacity="0.6" />
    <path d="M -100 420 C 300 420, 400 240, 760 300 C 1120 360, 1300 180, 1700 240" fill="none" stroke="url(#streamWave)" stroke-width="0.75" opacity="0.3" />
    
    <!-- Flowing animated packet line -->
    <path d="M -100 380 C 250 380, 450 180, 800 240 C 1150 300, 1350 120, 1700 180" fill="none" stroke="#ffffff" stroke-width="1.5" class="flowing-data" opacity="0.7" />
  </g>

  <!-- Right Side: Agile Delivery & Scaled Architecture Orbital System -->
  <!-- Center: (1200, 240) -->
  <g class="spin-ring" opacity="0.35">
    <!-- Outer Sprint Cycle Ring -->
    <circle cx="1200" cy="240" r="190" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="6 14 2 14" />
    <circle cx="1390" cy="240" r="4" fill="#ffffff" filter="url(#nodeGlow)" />
    <circle cx="1010" cy="240" r="3" fill="#a1a1aa" />
  </g>

  <g class="spin-ring-reverse" opacity="0.25">
    <!-- Middle Architecture Ring -->
    <circle cx="1200" cy="240" r="140" fill="none" stroke="#a1a1aa" stroke-width="1.2" stroke-dasharray="24 16 4 16" />
    <circle cx="1200" cy="100" r="4" fill="#ffffff" filter="url(#nodeGlow)" />
    <circle cx="1200" cy="380" r="3" fill="#a1a1aa" />
  </g>

  <g opacity="0.3">
    <!-- Inner Core Governance Circle -->
    <circle cx="1200" cy="240" r="85" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4 8" />
    <circle cx="1200" cy="240" r="40" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-width="0.75" />
  </g>

  <!-- Central Orbital Core Node -->
  <circle cx="1200" cy="240" r="7" fill="#ffffff" filter="url(#nodeGlow)" />
  <circle cx="1200" cy="240" r="15" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5" class="pulsing-node" />

  <!-- Distributed System Nodes & Interconnects -->
  <g opacity="0.6">
    <!-- Node A: Cloud & DevOps (1380, 140) -->
    <line x1="1200" y1="240" x2="1380" y2="140" stroke="url(#silverStroke)" stroke-width="1" />
    <circle cx="1380" cy="140" r="4" fill="#ffffff" filter="url(#nodeGlow)" />
    <text x="1395" y="144" font-family="'Inter', monospace" font-size="10" font-weight="600" fill="#e4e4e7" letter-spacing="1.5">AZURE // CLOUD DEVOPS</text>

    <!-- Node B: Cross-Platform Mobility (1040, 130) -->
    <line x1="1200" y1="240" x2="1040" y2="130" stroke="url(#silverStroke)" stroke-width="1" />
    <circle cx="1040" cy="130" r="4" fill="#ffffff" filter="url(#nodeGlow)" />
    <text x="840" y="134" font-family="'Inter', monospace" font-size="10" font-weight="600" fill="#e4e4e7" letter-spacing="1.5">CROSS-PLATFORM // MOBILE</text>

    <!-- Node C: Distributed Systems & Microservices (1350, 360) -->
    <line x1="1200" y1="240" x2="1350" y2="360" stroke="url(#silverStroke)" stroke-width="1" />
    <circle cx="1350" cy="360" r="4" fill="#ffffff" filter="url(#nodeGlow)" />
    <text x="1365" y="364" font-family="'Inter', monospace" font-size="10" font-weight="600" fill="#e4e4e7" letter-spacing="1.5">DISTRIBUTED // APIS</text>

    <!-- Node D: SAFe / Agile Delivery (1010, 340) -->
    <line x1="1200" y1="240" x2="1010" y2="340" stroke="url(#silverStroke)" stroke-width="1" />
    <circle cx="1010" cy="340" r="4" fill="#ffffff" filter="url(#nodeGlow)" />
    <text x="815" y="344" font-family="'Inter', monospace" font-size="10" font-weight="600" fill="#e4e4e7" letter-spacing="1.5">SAFe 6.0 // AGILE SCRUM</text>
  </g>

  <!-- Left Technical Badges & Blueprint Typography -->
  <g transform="translate(64, 56)">
    <!-- Mission Telemetry Badge -->
    <rect x="0" y="0" width="220" height="24" rx="4" fill="#09090b" fill-opacity="0.85" stroke="#3f3f46" stroke-width="1" />
    <circle cx="12" cy="12" r="3" fill="#ffffff" />
    <text x="24" y="16" font-family="'Inter', monospace" font-size="9" font-weight="700" fill="#f4f4f5" letter-spacing="2">SYSTEMS ARCHITECTURE</text>

    <!-- Header Title -->
    <text x="0" y="65" font-family="'Inter', -apple-system, sans-serif" font-size="32" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      ENTERPRISE SOFTWARE DELIVERY
    </text>
    <text x="0" y="96" font-family="'Inter', -apple-system, sans-serif" font-size="15" font-weight="500" fill="#a1a1aa" letter-spacing="0.2">
      Cross-Platform Applications · Scaled Agile Governance · Cloud Platforms
    </text>

    <!-- Technical Spec Pills -->
    <g transform="translate(0, 130)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="125" height="26" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
      <text x="62" y="17" font-family="'Inter', monospace" font-size="9" font-weight="600" fill="#e4e4e7" text-anchor="middle" letter-spacing="1">IOS ANDROID HYBRID</text>

      <!-- Pill 2 -->
      <rect x="135" y="0" width="135" height="26" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
      <text x="202" y="17" font-family="'Inter', monospace" font-size="9" font-weight="600" fill="#e4e4e7" text-anchor="middle" letter-spacing="1">SCALED AGILE</text>

      <!-- Pill 3 -->
      <rect x="280" y="0" width="160" height="26" rx="6" fill="#18181b" stroke="#3f3f46" stroke-width="0.8" />
      <text x="360" y="17" font-family="'Inter', monospace" font-size="9" font-weight="600" fill="#e4e4e7" text-anchor="middle" letter-spacing="1">CLOUD ARCHITECTURE</text>
    </g>
  </g>

  <!-- Precision Blueprint Technical Coordinate Markers -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.25">
    <!-- Top-Left Corner Bracket (Safe Inset) -->
    <path d="M 40 48 L 56 48" />
    <path d="M 56 32 L 56 48" />
    
    <!-- Top-Right Corner Bracket (Safe Inset) -->
    <path d="M 1560 48 L 1544 48" />
    <path d="M 1544 32 L 1544 48" />

    <!-- Bottom-Left Corner Bracket -->
    <path d="M 40 455 L 56 455" />
    <path d="M 56 470 L 56 455" />

    <!-- Bottom-Right Corner Bracket -->
    <path d="M 1560 455 L 1544 455" />
    <path d="M 1544 470 L 1544 455" />

    <!-- Crosshair Target Center Markers -->
    <path d="M 790 44 L 810 44" />
    <path d="M 800 34 L 800 54" />
    <circle cx="800" cy="44" r="6" fill="none" />
  </g>

  <!-- Bottom Coordinates Footer -->
  <g opacity="0.4">
    <text x="64" y="475" font-family="'Inter', monospace" font-size="8" font-weight="600" fill="#71717a" letter-spacing="3">SYSTEM STATUS: OPTIMAL · GLOBAL DELIVERY ARCHITECTURE</text>
    <text x="1536" y="475" font-family="'Inter', monospace" font-size="8" font-weight="600" fill="#71717a" text-anchor="end" letter-spacing="2">ENTERPRISE ARCHITECTURE · PORTFOLIO SHOWCASE</text>
  </g>
</svg>

