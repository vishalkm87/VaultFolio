<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Gradients for executive monochrome shading -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="55%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>

    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#a1a1aa" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="silverRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#a1a1aa" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#27272a" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.5" />
    </linearGradient>

    <linearGradient id="faceGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5" />
      <stop offset="40%" stop-color="#d4d4d8" />
      <stop offset="85%" stop-color="#71717a" />
      <stop offset="100%" stop-color="#3f3f46" />
    </linearGradient>

    <linearGradient id="suitGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="45%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <linearGradient id="lapelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" />
      <stop offset="50%" stop-color="#52525b" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#71717a" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes orbitRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes orbitCounterRotate {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.03); }
      }
      @keyframes sweepLight {
        0% { transform: translateX(-150px); }
        100% { transform: translateX(250px); }
      }
      .rotating-ring-1 {
        transform-origin: 200px 200px;
        animation: orbitRotate 24s linear infinite;
      }
      .rotating-ring-2 {
        transform-origin: 200px 200px;
        animation: orbitCounterRotate 36s linear infinite;
      }
      .aura-glow {
        transform-origin: 200px 200px;
        animation: pulseAura 4s ease-in-out infinite;
      }
      .sweep-shimmer {
        animation: sweepLight 5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="400" fill="url(#bgGrad)" />

  <!-- Outer Metallic Border -->
  <rect x="3" y="3" width="394" height="394" rx="197" fill="none" stroke="url(#silverRim)" stroke-width="2.5" />

  <!-- Ambient Aura Glow -->
  <circle cx="200" cy="180" r="140" fill="url(#haloGlow)" class="aura-glow" />

  <!-- Precision Technical Rings -->
  <g class="rotating-ring-1" opacity="0.3">
    <circle cx="200" cy="200" r="168" fill="none" stroke="#a1a1aa" stroke-width="1" stroke-dasharray="8 12 3 12" />
    <circle cx="368" cy="200" r="3.5" fill="#ffffff" />
    <circle cx="32" cy="200" r="2" fill="#a1a1aa" />
  </g>

  <g class="rotating-ring-2" opacity="0.2">
    <circle cx="200" cy="200" r="150" fill="none" stroke="#71717a" stroke-width="1" stroke-dasharray="18 18 2 18" />
    <circle cx="200" cy="350" r="3" fill="#ffffff" />
  </g>

  <!-- Circular Mask for Avatar Portrait Silhouette -->
  <g filter="url(#subtleShadow)">
    <!-- Shoulders & Executive Jacket -->
    <path d="M 90 400 C 90 325, 140 280, 200 280 C 260 280, 310 325, 310 400 Z" fill="url(#suitGrad)" />
    
    <!-- Outer Jacket Trim / Shoulders Contours -->
    <path d="M 90 400 C 92 335, 138 290, 195 282" fill="none" stroke="url(#silverRim)" stroke-width="1.5" opacity="0.6" />
    <path d="M 310 400 C 308 335, 262 290, 205 282" fill="none" stroke="url(#silverRim)" stroke-width="1.5" opacity="0.4" />

    <!-- Jacket Lapels & Collar -->
    <polygon points="172,282 200,345 150,400 130,400" fill="url(#lapelGrad)" />
    <polygon points="228,282 200,345 250,400 270,400" fill="url(#lapelGrad)" opacity="0.85" />
    
    <!-- Lapel Highlight Lines -->
    <line x1="172" y1="282" x2="200" y2="345" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
    <line x1="228" y1="282" x2="200" y2="345" stroke="#a1a1aa" stroke-width="1" opacity="0.5" />

    <!-- Shirt Collar V-neck -->
    <polygon points="188,270 200,315 212,270" fill="#f4f4f5" />
    <polygon points="196,285 200,315 204,285" fill="#18181b" />

    <!-- Neck -->
    <path d="M 182 230 L 182 278 C 188 284, 212 284, 218 278 L 218 230 Z" fill="#71717a" />
    <!-- Neck Shadow -->
    <path d="M 182 245 C 192 260, 208 260, 218 245 L 218 278 C 212 284, 188 284, 182 278 Z" fill="#27272a" opacity="0.6" />

    <!-- Head / Jawline -->
    <path d="M 152 165 C 152 235, 175 255, 200 255 C 225 255, 248 235, 248 165 C 248 105, 225 90, 200 90 C 175 90, 152 105, 152 165 Z" fill="url(#faceGrad)" />

    <!-- Face Facet Highlights (Sleek Geometric Tech Chiseled Planes) -->
    <!-- Left Jaw Highlight -->
    <path d="M 152 165 C 153 210, 170 245, 200 255 L 200 230 C 178 220, 165 190, 165 165 Z" fill="#ffffff" opacity="0.18" />
    
    <!-- Cheekbone Reflection -->
    <path d="M 160 160 Q 175 190, 200 200 Q 185 180, 170 160 Z" fill="#ffffff" opacity="0.25" />

    <!-- Minimalist Modern Executive Tech Eyewear / Framing -->
    <g opacity="0.95">
      <!-- Left Glass Frame -->
      <rect x="162" y="152" width="32" height="18" rx="4" fill="#09090b" stroke="url(#accentLine)" stroke-width="1.5" />
      <!-- Right Glass Frame -->
      <rect x="206" y="152" width="32" height="18" rx="4" fill="#09090b" stroke="url(#accentLine)" stroke-width="1.5" />
      <!-- Glass Bridge -->
      <line x1="194" y1="160" x2="206" y2="160" stroke="#ffffff" stroke-width="2" />
      <!-- Frame Temples -->
      <line x1="152" y1="157" x2="162" y2="157" stroke="#ffffff" stroke-width="1.5" />
      <line x1="238" y1="157" x2="248" y2="157" stroke="#ffffff" stroke-width="1.5" />
      
      <!-- Glass Lens Reflection Accents -->
      <line x1="166" y1="155" x2="182" y2="167" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
      <line x1="210" y1="155" x2="226" y2="167" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
    </g>

    <!-- Professional Sleek Hair / Contour -->
    <path d="M 148 145 C 145 110, 168 85, 200 82 C 232 85, 255 110, 252 145 C 248 118, 230 100, 200 100 C 170 100, 152 118, 148 145 Z" fill="#09090b" />
    
    <!-- Hair Specular Highlights -->
    <path d="M 165 98 C 180 90, 210 88, 235 96 C 215 91, 185 92, 165 98 Z" fill="#ffffff" opacity="0.35" />

    <!-- Executive Emblem Badge at Lapel -->
    <g transform="translate(150, 345)">
      <circle cx="10" cy="10" r="12" fill="#09090b" stroke="url(#silverRim)" stroke-width="1.2" />
      <polygon points="10,5 14,9.5 10,15 6,9.5" fill="#ffffff" opacity="0.9" />
      <circle cx="10" cy="9.5" r="1.5" fill="#38bdf8" />
    </g>
  </g>

  <!-- Precision Corner Coordinate Marks (Tech UI Detail) -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.3">
    <!-- Top-Left Corner Bracket -->
    <path d="M 60 75 L 75 75" />
    <path d="M 75 60 L 75 75" />
    
    <!-- Top-Right Corner Bracket -->
    <path d="M 340 75 L 325 75" />
    <path d="M 325 60 L 325 75" />

    <!-- Bottom Tech Sub-label -->
    <text x="200" y="386" font-family="'Inter', monospace" font-size="7" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="3" opacity="0.7">EXECUTIVE ARCHITECTURE · PROFESSIONAL SHOWCASE</text>
  </g>
</svg>

