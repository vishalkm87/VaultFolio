<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <!-- Radiant Architectural Jewel Gradient -->
    <linearGradient id="favJewelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1d4ed8" />
      <stop offset="75%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Specular Glassmorphic Reflection -->
    <linearGradient id="favGlassSheen" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5" />
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Depth Shadow for Center Emblem -->
    <filter id="favDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Satellite Node Glow Filter -->
    <filter id="favNodeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes spinOrbit {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes pulseRadar {
        0% { transform: scale(0.7); opacity: 0.9; }
        50% { transform: scale(1.6); opacity: 0.15; }
        100% { transform: scale(0.7); opacity: 0.9; }
      }
      .fav-orbit-spin {
        transform-origin: 24px 24px;
        animation: spinOrbit 10s linear infinite;
      }
      .fav-beacon-wave {
        transform-origin: 38px 10px;
        animation: pulseRadar 2s ease-in-out infinite;
      }
      @media (prefers-color-scheme: dark) {
        .fav-squircle-border {
          stroke: rgba(56, 189, 248, 0.7);
        }
      }
    </style>
  </defs>

  <!-- 1. Architectural Squircle Foundation -->
  <rect 
    class="fav-squircle-border"
    x="2.5" 
    y="2.5" 
    width="43" 
    height="43" 
    rx="12.5" 
    fill="url(#favJewelGrad)" 
    stroke="rgba(255, 255, 255, 0.4)" 
    stroke-width="1.2"
  />

  <!-- 2. Glassmorphic Specular Highlight -->
  <path 
    d="M 2.5 15 C 2.5 8.096 8.096 2.5 15 2.5 L 33 2.5 C 39.904 2.5 45.5 8.096 45.5 15 L 45.5 22 C 34 26 14 22 2.5 17 Z" 
    fill="url(#favGlassSheen)" 
  />

  <!-- 3. Continuous Live Orbital Blueprint Ring & Satellite -->
  <g class="fav-orbit-spin">
    <animateTransform 
      attributeName="transform" 
      type="rotate" 
      from="0 24 24" 
      to="360 24 24" 
      dur="10s" 
      repeatCount="indefinite" 
    />
    <circle 
      cx="24" 
      cy="24" 
      r="17" 
      stroke="rgba(255, 255, 255, 0.35)" 
      stroke-width="1.2" 
      stroke-dasharray="6 4 14 4"
      fill="none"
    />
    <circle 
      cx="41" 
      cy="24" 
      r="2.3" 
      fill="#67e8f9" 
      filter="url(#favNodeGlow)" 
    />
  </g>

  <!-- 4. Universal Architectural Diamond / Prism Emblem -->
  <g 
    stroke="#ffffff" 
    stroke-width="2.4" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#favDropShadow)"
  >
    <!-- Faceted Hexagonal Diamond Silhouette -->
    <polygon points="24,14 34,20 34,28 24,34 14,28 14,20" fill="rgba(255,255,255,0.18)" />
    <line x1="24" y1="14" x2="24" y2="34" />
    <line x1="14" y1="20" x2="34" y2="28" />
    <line x1="14" y1="28" x2="34" y2="20" />
    <circle cx="24" cy="24" r="2.2" fill="#ffffff" />
  </g>

  <!-- 5. Real-Time Active System Radar Beacon (Top-Right) -->
  <g>
    <!-- Pulsing Radar Wave (SMIL + CSS fallback) -->
    <circle 
      class="fav-beacon-wave" 
      cx="38" 
      cy="10" 
      r="3.8" 
      fill="#22c55e" 
      opacity="0.8"
    >
      <animate 
        attributeName="r" 
        values="2.5;5.5;2.5" 
        dur="2.2s" 
        repeatCount="indefinite" 
      />
      <animate 
        attributeName="opacity" 
        values="0.85;0.12;0.85" 
        dur="2.2s" 
        repeatCount="indefinite" 
      />
    </circle>
    <!-- Core Luminous Beacon Node -->
    <circle 
      cx="38" 
      cy="10" 
      r="2.2" 
      fill="#4ade80" 
      stroke="#ffffff" 
      stroke-width="0.9" 
    />
  </g>
</svg>
